<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#FAF8F1; --surface:#FFFFFF; --ink:#2E3A22; --ink-soft:#71785F;
    --border:#E5E1D2; --gold:#C9A66B; --olive:#51623A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; overscroll-behavior-y: none; }
  #root{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; display:flex; flex-direction:column; }
  .app-shell{ flex-direction: column; }

  /* Notebook / pantallas anchas: la app se despliega usando más ancho, celular queda igual */
  @media (min-width: 900px){
    body{ background:#EDE8D8; }
    #root{
      max-width: 1120px; min-height: 92vh; margin: 4vh auto;
      border-radius: 18px; box-shadow: 0 1px 0 var(--border), 0 24px 60px rgba(46,58,34,0.18);
      overflow: hidden;
    }
    .app-shell{ flex-direction: row !important; height: 92vh !important; }
    .app-header{
      flex-direction: column !important; align-items: flex-start !important;
      width: 220px !important; flex-shrink: 0 !important; height: 100% !important;
      border-right: 1px solid var(--border) !important; border-bottom: none !important;
      padding: 20px 16px !important; gap: 10px !important; overflow-x: visible !important;
    }
    .app-header button{ justify-content: center !important; }
    .app-header-social{ margin-left: 0 !important; margin-top: auto !important; flex-wrap: wrap !important; }
    .app-content{ flex: 1 !important; overflow-y: auto !important; min-width: 0 !important; }
    .sheet-overlay{ align-items: center !important; }
    .sheet-panel{ border-radius: 20px !important; max-height: 82vh !important; box-shadow: 0 20px 60px rgba(46,58,34,0.3) !important; }
  }
  button{ font-family:inherit; cursor:pointer; }
  input,select{ font-family:inherit; }
  ::-webkit-scrollbar{ display:none; }

  /* Botones 3D cuadrados (nav + redes sociales) */
  .sqbtn{
    width:46px; height:46px; flex-shrink:0; border:none; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(160deg, #FFFEFB 0%, #F1EAD9 60%, #E9E0CA 100%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), inset 0 -3px 4px rgba(120,100,60,0.12),
      0 3px 6px rgba(46,58,34,0.16), 0 1px 2px rgba(46,58,34,0.12);
    transition: transform .08s ease;
  }
  .sqbtn:active{ transform: translateY(1px) scale(0.97); }
  .sqbtn.is-active{
    background: linear-gradient(160deg, #6B7D4C 0%, #51623A 60%, #445430 100%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.25), inset 0 -3px 4px rgba(0,0,0,0.25),
      0 3px 6px rgba(46,58,34,0.3), 0 1px 2px rgba(46,58,34,0.2);
  }
  .sqbtn.sq-fb{ background: linear-gradient(160deg, #5B8DEF 0%, #1877F2 65%, #145DC4 100%); }
  .sqbtn.sq-ig{ background: linear-gradient(160deg, #F9A34B 0%, #E1306C 45%, #7B3FE4 100%); }
  .sqbtn.sq-wa{ background: linear-gradient(160deg, #4BD87C 0%, #25D366 60%, #1DAA53 100%); }

  /* Tarjeta 3D rectangular para el logo */
  .logo3d{
    height:52px; padding:6px 16px; flex-shrink:0; border:none; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(160deg, #FFFEFB 0%, #F1EAD9 60%, #E9E0CA 100%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.9), inset 0 -3px 4px rgba(120,100,60,0.12),
      0 3px 6px rgba(46,58,34,0.16), 0 1px 2px rgba(46,58,34,0.12);
    transition: transform .08s ease;
  }
  .logo3d:active{ transform: translateY(1px) scale(0.98); }
</style>
</head>

function calcAge(birthdate){
  if(!birthdate) return null;
  const b = new Date(birthdate+"T00:00:00"), now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
  return age;
}
function nextBirthday(birthdate){
  if(!birthdate) return null;
  const b = new Date(birthdate+"T00:00:00"), now = new Date();
  let next = new Date(now.getFullYear(), b.getMonth(), b.getDate());
  next.setHours(0,0,0,0);
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (next < today0) next = new Date(now.getFullYear()+1, b.getMonth(), b.getDate());
  return next;
}
function daysUntil(date){
  const now = new Date(); const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((date - today0) / 86400000);
}
function buildBirthdayMessage(client){
  return `¡Feliz cumpleaños, ${client.name.split(" ")[0]}! 🎂🌿 Todo el equipo de *${SPA_NAME}* te desea un día hermoso. Como regalo, tienes un descuento especial esperándote en tu próxima visita. ¡Nos encantaría verte pronto! Cualquier consulta, escríbenos al ${SPA_PHONE_LOCAL}.`;
}

const DAY_START = 8 * 60, DAY_END = 20 * 60, SLOT = 30, ROW_H = 46;

function pad(n){ return String(n).padStart(2,"0"); }
function iso(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function startOfWeek(d){ const r=new Date(d); const day=(r.getDay()+6)%7; return addDays(r,-day); }
function sameDay(a,b){ return iso(a)===iso(b); }
function mins(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function timeLabel(m){ const h=Math.floor(m/60), mm=m%60, ap=h<12?"a.m.":"p.m."; const h12=h%12===0?12:h%12; return `${h12}:${pad(mm)} ${ap}`; }

const WD_LONG = ["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

function reminderDate(appt){ return addDays(new Date(appt.date+"T00:00:00"), -1); }
function formatFullDate(date){ return `${WD_LONG[(date.getDay()+6)%7]} ${date.getDate()} de ${MONTHS[date.getMonth()]}`; }
function buildReminderMessage(appt, pro){
  const rd = new Date(appt.date+"T00:00:00");
  return `Hola ${appt.client.split(" ")[0]}! 🌿 Te escribimos de *${SPA_NAME}* para recordarte tu cita de *${appt.service}* mañana ${formatFullDate(rd)} a las ${timeLabel(mins(appt.start))} con ${pro.name}. ¿Confirmas tu asistencia? Responde *SÍ* para confirmar o avísanos si necesitas reagendar.\n\nCualquier consulta, escríbenos al ${SPA_PHONE_LOCAL}. ¡Te esperamos!`;
}
function waLink(phone, text){
  const clean = (phone||"").replace(/[^0-9]/g,"");
  return `https://wa.me/${clean}?text=${encodeURIComponent(text)}`;
}

function AppInner(){
  const today = useMemo(() => new Date(), []);
  const [current, setCurrent] = useState(today);
  const [proFilter, setProFilter] = useState("all"); // "all" or a pro id
  const [appointments, setAppointments] = useState([]);
  const [pros, setPros] = useState([]);
  const [clients, setClients] = useState([]);
  const [services, setServices] = useState([]);
  const [synced, setSynced] = useState(false);
  const [tab, setTab] = useState("agenda"); // "agenda" | "clientes"
  const [sheet, setSheet] = useState(null); // {mode:'new'|'detail'|'client', ...}
  const timelineRef = useRef(null);

  // Sincronización en tiempo real con Firestore: cualquier cambio hecho desde
  // otro celular/notebook aparece acá solo, sin recargar la página.
  useEffect(() => {
    const unsubApts = db.collection("appointments").onSnapshot(snap => {
      setAppointments(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    const unsubClients = db.collection("clients").onSnapshot(snap => {
      setClients(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    const unsubPros = db.collection("pros").onSnapshot(async snap => {
      if (snap.empty) {
        const metaRef = db.collection("meta").doc("init");
        const metaDoc = await metaRef.get();
        if (!metaDoc.exists) {
          await metaRef.set({ seededAt: new Date().toISOString() });
          const batch = db.batch();
          seedPros().forEach(p => { const { id, ...rest } = p; batch.set(db.collection("pros").doc(), rest); });
          await batch.commit();
        }
      } else {
        setPros(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      }
      setSynced(true);
    });
    const unsubServices = db.collection("services").onSnapshot(async snap => {
      if (snap.empty) {
        const metaRef = db.collection("meta").doc("initServices");
        const metaDoc = await metaRef.get();
        if (!metaDoc.exists) {
          await metaRef.set({ seededAt: new Date().toISOString() });
          const batch = db.batch();
          SERVICES.forEach(name => { batch.set(db.collection("services").doc(), { name }); });
          await batch.commit();
        }
      } else {
        setServices(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      }
    });
    return () => { unsubApts(); unsubClients(); unsubPros(); unsubServices(); };
  }, []);

  useEffect(() => {
    if (timelineRef.current) timelineRef.current.scrollTop = Math.max(0, (9*60 - DAY_START)/SLOT*ROW_H - 60);
  }, [current, tab]);

  const weekDates = useMemo(() => Array.from({length:7},(_,i)=>addDays(startOfWeek(current), i)), [current]);
  const d = iso(current);

  const dayAppts = useMemo(() => {
    return appointments
      .filter(a => a.date === d && (proFilter === "all" || a.profId === proFilter))
      .sort((x,y) => mins(x.start) - mins(y.start));
  }, [appointments, d, proFilter]);

  function proOf(id){ return pros.find(p => p.id === id); }
  function addPro(name, role){
    const nm = name.trim();
    if(!nm) return;
    const usedColors = pros.map(p => p.color);
    const color = PRO_COLOR_PALETTE.find(c => !usedColors.includes(c)) || PRO_COLOR_PALETTE[pros.length % PRO_COLOR_PALETTE.length];
    db.collection("pros").add({ name:nm, role: role.trim() || "Profesional", color, initials: initialsOf(nm) });
  }
  function removePro(id){
    if (pros.length <= 1){ alert("Tiene que quedar al menos una profesional cargada."); return; }
    const inUse = appointments.some(a => a.profId === id);
    if (inUse){ alert("Esta profesional tiene citas agendadas. Reasigna o elimina esas citas antes de borrarla."); return; }
    db.collection("pros").doc(id).delete();
    if (proFilter === id) setProFilter("all");
  }
  function addService(name){
    const nm = name.trim();
    if(!nm) return;
    if (services.some(s => s.name.toLowerCase() === nm.toLowerCase())){ alert("Ese tratamiento ya está cargado."); return; }
    db.collection("services").add({ name: nm });
  }
  function removeService(id){
    if (services.length <= 1){ alert("Tiene que quedar al menos un tratamiento cargado."); return; }
    db.collection("services").doc(id).delete();
  }
  function clientOf(id){ return clients.find(c => c.id === id); }
  function apptsForClient(client){
    const key = clientKey(client.name, client.phone);
    return appointments.filter(a => clientKey(a.client, a.phone) === key).sort((x,y) => (y.date+y.start).localeCompare(x.date+x.start));
  }

  function upsertClient(name, phone){
    const key = clientKey(name, phone);
    const found = clients.find(c => clientKey(c.name, c.phone) === key);
    if (found) return found;
    db.collection("clients").add({ name, phone, birthdate:"", tratamientos:"", notes:"", clinical: blankClinical(), treatmentPlans: [] });
    return null;
  }

  function openNew(prefillStart){
    setSheet({ mode:"new", profId: proFilter === "all" ? pros[0].id : proFilter, date:d, start: prefillStart || "09:00", duration:30, client:"", phone:"", service:SERVICES[0] });
  }
  function saveNew(){
    if(!sheet.client.trim()) return;
    const name = sheet.client.trim(), phone = sheet.phone.trim();
    upsertClient(name, phone);
    db.collection("appointments").add({ profId:sheet.profId, date:sheet.date, start:sheet.start, duration:Number(sheet.duration), client:name, phone, service:sheet.service, status:"pendiente", reminderStatus:"pendiente" });
    setSheet(null);
  }
  function removeAppt(id){ db.collection("appointments").doc(id).delete(); setSheet(null); }
  function toggleStatus(id){
    const appt = appointments.find(a => a.id === id);
    if (!appt) return;
    const status = appt.status === "confirmada" ? "pendiente" : "confirmada";
    db.collection("appointments").doc(id).update({ status });
    setSheet(s => s && s.id===id ? {...s, status} : s);
  }
  function sendReminder(id){
    db.collection("appointments").doc(id).update({ reminderStatus:"enviado" });
    setSheet(s => s && s.id===id ? {...s, reminderStatus:"enviado"} : s);
  }
  function confirmReminder(id){
    db.collection("appointments").doc(id).update({ reminderStatus:"confirmada", status:"confirmada" });
    setSheet(s => s && s.id===id ? {...s, reminderStatus:"confirmada", status:"confirmada"} : s);
  }
  function updateClient(id, patch){
    db.collection("clients").doc(id).update(patch);
    setSheet(s => s && s.mode==="client" && s.id===id ? {...s, ...patch} : s);
  }
  function markBirthdaySent(id){ updateClient(id, { birthdaySentYear: today.getFullYear() }); }
  function deleteClient(id){
    db.collection("clients").doc(id).delete();
    setSheet(null);
  }

  const todayCount = appointments.filter(a => a.date === iso(today)).length;
  const birthdaysToday = clients.filter(c => c.birthdate && (() => {
    const b = new Date(c.birthdate+"T00:00:00");
    return b.getMonth() === today.getMonth() && b.getDate() === today.getDate();
  })());

  const rows = [];
  for (let m = DAY_START; m < DAY_END; m += SLOT) rows.push(m);

  if (!synced) {
    return (
      <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:14, background:T.bg }}>
        <img src={LOGO_SRC} alt={SPA_NAME} style={{ width:140, height:"auto" }} />
        <div style={{ color:T.inkSoft, fontSize:13.5 }}>Sincronizando…</div>
      </div>
    );
  }

  return (
    <div className="app-shell" style={{ display:"flex", height:"100vh" }}>
      {/* header */}
      {/* header — logo + navegación + configuración + redes, todo en botones cuadrados 3D */}
      <div className="app-header" style={{ padding:"10px 12px", display:"flex", alignItems:"center", gap:8, borderBottom:`1px solid ${T.border}`, background:T.surface, overflowX:"auto" }}>
        <button onClick={() => { setSheet(null); setTab("agenda"); }} title="Ir al inicio" className="logo3d" style={{ marginRight:2 }}>
          <img src={LOGO_SRC} alt="Sonia Lanoza" style={{ height:40, width:"auto" }} />
        </button>

        <div style={{ position:"relative" }}>
          <button onClick={() => { setSheet(null); setTab("agenda"); }} title="Agendamiento" className={"sqbtn" + ((!sheet && tab==="agenda") ? " is-active" : "")}>
            <IconCalendar color={(!sheet && tab==="agenda") ? "#fff" : T.olive} />
          </button>
          {todayCount > 0 && (
            <span style={{ position:"absolute", top:-4, right:-4, background:T.gold, color:"#fff", fontSize:10, fontWeight:700, borderRadius:999, minWidth:16, height:16, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 3px", boxShadow:"0 1px 2px rgba(0,0,0,0.25)" }}>{todayCount}</span>
          )}
        </div>

        <button onClick={() => { setSheet(null); setTab("clientes"); }} title="Clientes" className={"sqbtn" + ((!sheet && tab==="clientes") ? " is-active" : "")}>
          <IconFolder color={(!sheet && tab==="clientes") ? "#fff" : T.olive} />
        </button>

        <button onClick={() => setSheet({ mode:"backup" })} title="Copia de seguridad" className="sqbtn is-active">
          <IconGear color="#fff" />
        </button>

        <div className="app-header-social" style={{ marginLeft:"auto", display:"flex", gap:8 }}>
          <a href={FACEBOOK_URL} target="_blank" rel="noreferrer" title="Facebook" className="sqbtn sq-fb" style={socialBtn}><IconFacebook /></a>
          <a href={INSTAGRAM_URL} target="_blank" rel="noreferrer" title="Instagram" className="sqbtn sq-ig" style={socialBtn}><IconInstagram /></a>
          <a href={WHATSAPP_URL} target="_blank" rel="noreferrer" title="WhatsApp" className="sqbtn sq-wa" style={socialBtn}><IconWhatsapp /></a>
        </div>
      </div>

      <div className="app-content" style={{ display:"flex", flexDirection:"column", flex:1, minHeight:0 }}>
      {birthdaysToday.length > 0 && (
        <div style={{ background:"#FBF1DE", borderBottom:"1px solid #EFDDB0", padding:"10px 16px" }}>
          <div style={{ fontSize:11.5, fontWeight:700, color:"#8C6A2A", textTransform:"uppercase", letterSpacing:"0.04em", marginBottom:6 }}>
            🎂 Hoy cumple{birthdaysToday.length > 1 ? "n" : ""} años
          </div>
          {birthdaysToday.map(c => (
            <div key={c.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"4px 0" }}>
              <span style={{ flex:1, fontSize:13.5, fontWeight:600, color:T.ink, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{c.name}</span>
              {c.phone && (
                <React.Fragment>
                  <a href={`tel:${c.phone.replace(/[^0-9+]/g,"")}`} style={{ ...pillBtnStyle, background:T.surface, color:T.ink }}>📞 Llamar</a>
                  <a href={waLink(c.phone, buildBirthdayMessage(c))} target="_blank" rel="noreferrer" style={{ ...pillBtnStyle, background:"#25D366", color:"#fff" }}>WhatsApp</a>
                </React.Fragment>
              )}
            </div>
          ))}
        </div>
      )}

      {tab === "agenda" ? (
        <React.Fragment>
          {/* week strip */}
          <div style={{ display:"flex", padding:"10px 10px 6px", gap:6, background:T.surface, borderBottom:`1px solid ${T.border}` }}>
            {weekDates.map((date,i) => {
              const sel = sameDay(date, current);
              const isToday = sameDay(date, today);
              return (
                <button key={i} onClick={() => setCurrent(date)}
                  style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:2, padding:"8px 0", borderRadius:12, border:"none",
                    background: sel ? T.ink : (isToday ? "#F0ECDC" : "transparent") }}>
                  <span style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", color: sel ? "#fff" : T.inkSoft }}>{WD_SHORT[i]}</span>
                  <span style={{ fontSize:15, fontWeight:700, color: sel ? "#fff" : T.ink }}>{date.getDate()}</span>
                </button>
              );
            })}
          </div>

          {/* month/day label + nav */}
          <div style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 16px", background:T.surface, borderBottom:`1px solid ${T.border}` }}>
            <button onClick={() => setCurrent(a => addDays(a,-1))} style={navBtn}>‹</button>
            <div style={{ flex:1, textAlign:"center", fontFamily:"'Cormorant Garamond',serif", fontSize:19, fontWeight:700, textTransform:"capitalize" }}>
              {WD_LONG[(current.getDay()+6)%7]} {current.getDate()} de {MONTHS[current.getMonth()]}
            </div>
            <button onClick={() => setCurrent(a => addDays(a,1))} style={navBtn}>›</button>
          </div>

          {/* professional chips */}
          {pros.length > 1 && (
            <div style={{ display:"flex", gap:8, padding:"10px 16px", overflowX:"auto", background:T.surface, borderBottom:`1px solid ${T.border}` }}>
              <Chip active={proFilter==="all"} onClick={() => setProFilter("all")} label="Todas" />
              {pros.map(p => (
                <Chip key={p.id} active={proFilter===p.id} onClick={() => setProFilter(p.id)} label={p.name.split(" ")[0]} dot={p.color} />
              ))}
            </div>
          )}

          {/* timeline */}
          <div ref={timelineRef} style={{ flex:1, overflowY:"auto", position:"relative", padding:"6px 0 90px" }}>
            {rows.map(m => (
              <div key={m} onClick={() => openNew(`${pad(Math.floor(m/60))}:${pad(m%60)}`)}
                style={{ display:"flex", minHeight:ROW_H, borderTop: m%60===0 ? `1px solid ${T.border}` : `1px dashed #EFEAE0` }}>
                <div style={{ width:52, flexShrink:0, paddingTop:2, textAlign:"right", paddingRight:8 }}>
                  {m%60===0 && <span style={{ fontSize:11, color:T.inkSoft, fontWeight:600 }}>{pad(Math.floor(m/60))}:00</span>}
                </div>
                <div style={{ flex:1, borderLeft:`1px solid ${T.border}` }} />
              </div>
            ))}

            {dayAppts.map(a => {
              const pro = proOf(a.profId);
              const top = ((mins(a.start) - DAY_START) / SLOT) * ROW_H;
              const height = Math.max((a.duration/SLOT)*ROW_H - 4, 34);
              const rDot = a.reminderStatus === "confirmada" ? "#51623A" : a.reminderStatus === "enviado" ? T.gold : "#D8D2C0";
              return (
                <button key={a.id} onClick={(e) => { e.stopPropagation(); setSheet({ mode:"detail", ...a }); }}
                  style={{ position:"absolute", left:60, right:16, top, height, textAlign:"left",
                    background: pro.color+"1E", borderLeft:`3px solid ${pro.color}`, borderRadius:9, padding:"6px 10px",
                    boxShadow:"0 1px 3px rgba(46,58,34,0.1)", border:"none", overflow:"hidden" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", gap:6 }}>
                    <span style={{ display:"flex", alignItems:"center", gap:6, fontSize:13.5, fontWeight:700, color:T.ink, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                      <span title={"Recordatorio: "+a.reminderStatus} style={{ width:7, height:7, borderRadius:"50%", background:rDot, flexShrink:0 }} />
                      {a.client}
                    </span>
                    <span style={{ fontSize:10.5, color:T.inkSoft, flexShrink:0 }}>{timeLabel(mins(a.start))}</span>
                  </div>
                  {height > 40 && <div style={{ fontSize:11.5, color:T.inkSoft, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{pro.initials} · {a.service}</div>}
                </button>
              );
            })}

            {dayAppts.length === 0 && (
              <div style={{ position:"absolute", top:120, left:0, right:0, textAlign:"center", color:T.inkSoft, fontSize:13.5, padding:"0 40px" }}>
                Sin citas para este día. Toca un horario para agendar.
              </div>
            )}
          </div>

          {/* FAB */}
          <button onClick={() => openNew()} style={{ position:"absolute", right:18, bottom:22, width:56, height:56, borderRadius:"50%",
            background:T.ink, color:"#fff", border:"none", fontSize:26, boxShadow:"0 8px 20px rgba(46,58,34,0.35)", display:"flex", alignItems:"center", justifyContent:"center" }}>
            +
          </button>
        </React.Fragment>
      ) : (
        <ClientesView
          clients={clients}
          apptsForClient={apptsForClient}
          onOpen={(c) => setSheet({ mode:"client", ...c })}
          onNew={() => setSheet({ mode:"newClient", name:"", phone:"", birthdate:"", tratamientos:"", notes:"" })}
        />
      )}
      </div>

      {sheet && (
        <BottomSheet onClose={() => setSheet(null)}>
          {sheet.mode === "new" && (
            <NewForm sheet={sheet} setSheet={setSheet} onSave={saveNew} onClose={() => setSheet(null)} clients={clients} pros={pros} services={services} />
          )}
          {sheet.mode === "detail" && (
            <Detail appt={sheet} pro={proOf(sheet.profId)} onDelete={() => removeAppt(sheet.id)} onToggle={() => toggleStatus(sheet.id)}
              onSendReminder={() => sendReminder(sheet.id)} onConfirmReminder={() => confirmReminder(sheet.id)} onClose={() => setSheet(null)} />
          )}
          {sheet.mode === "client" && (
            <ClientDetail client={sheet} history={apptsForClient(sheet)} proOf={proOf}
              onUpdate={(patch) => updateClient(sheet.id, patch)} onSendBirthday={() => markBirthdaySent(sheet.id)}
              onDelete={() => deleteClient(sheet.id)} onClose={() => setSheet(null)} />
          )}
          {sheet.mode === "newClient" && (
            <NewClientForm sheet={sheet} setSheet={setSheet}
              onSave={() => {
                if(!sheet.name.trim()) return;
                db.collection("clients").add({ name:sheet.name.trim(), phone:sheet.phone.trim(), birthdate:sheet.birthdate, tratamientos:sheet.tratamientos, notes:sheet.notes, clinical: blankClinical(), treatmentPlans: [] });
                setSheet(null);
              }}
              onClose={() => setSheet(null)} />
          )}
          {sheet.mode === "backup" && (
            <BackupView clients={clients} appointments={appointments}
              onRestore={async (data) => {
                const collections = [["appointments", appointments], ["clients", clients], ["pros", pros], ["services", services]];
                for (const [name, current] of collections) {
                  const delBatch = db.batch();
                  current.forEach(item => delBatch.delete(db.collection(name).doc(item.id)));
                  await delBatch.commit();
                }
                const writeBatch = db.batch();
                (data.appointments||[]).forEach(item => { const { id, ...rest } = item; writeBatch.set(db.collection("appointments").doc(), rest); });
                (data.clients||[]).forEach(item => { const { id, ...rest } = item; writeBatch.set(db.collection("clients").doc(), rest); });
                (data.pros||[]).forEach(item => { const { id, ...rest } = item; writeBatch.set(db.collection("pros").doc(), rest); });
                (data.services||[]).forEach(item => { const { id, ...rest } = item; writeBatch.set(db.collection("services").doc(), rest); });
                await writeBatch.commit();
              }}
              pros={pros} onAddPro={addPro} onRemovePro={removePro}
              services={services} onAddService={addService} onRemoveService={removeService}
              onClose={() => setSheet(null)} />
          )}
        </BottomSheet>
      )}
    </div>
  );
}

const socialBtn = { border:"none", display:"flex", alignItems:"center", justifyContent:"center", textDecoration:"none" };
const pillBtnStyle = { padding:"5px 10px", borderRadius:999, fontSize:11.5, fontWeight:700, textDecoration:"none", border:`1px solid ${T.border}`, whiteSpace:"nowrap" };

function Chip({ active, onClick, label, dot }){
  return (
    <button onClick={onClick} style={{ display:"flex", alignItems:"center", gap:6, padding:"7px 13px", borderRadius:999, whiteSpace:"nowrap",
      border:`1px solid ${active ? T.ink : T.border}`, background: active ? T.ink : T.surface, color: active ? "#fff" : T.ink, fontSize:13, fontWeight:600, flexShrink:0 }}>
      {dot && <span style={{ width:8, height:8, borderRadius:"50%", background:dot }} />}
      {label}
    </button>
  );
}

function ClientesView({ clients, apptsForClient, onOpen, onNew }){
  const [q, setQ] = useState("");
  const filtered = useMemo(() => {
    const query = q.trim().toLowerCase();
    const list = !query ? clients : clients.filter(c => c.name.toLowerCase().includes(query) || (c.phone||"").includes(query));
    return [...list].sort((a,b) => a.name.localeCompare(b.name));
  }, [clients, q]);

  return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", minHeight:0 }}>
      <div style={{ padding:"12px 16px", background:T.surface, borderBottom:`1px solid ${T.border}` }}>
        <input value={q} onChange={e => setQ(e.target.value)} placeholder="Buscar cliente o teléfono" style={inputStyle} />
      </div>
      <div style={{ flex:1, overflowY:"auto", padding:"10px 14px 100px" }}>
        {filtered.map(c => <ClientCard key={c.id} client={c} history={apptsForClient(c)} onClick={() => onOpen(c)} />)}
        {filtered.length === 0 && <div style={{ textAlign:"center", color:T.inkSoft, fontSize:13.5, padding:"40px 20px" }}>Sin resultados.</div>}
      </div>
      <button onClick={onNew} style={{ position:"absolute", right:18, bottom:22, width:56, height:56, borderRadius:"50%",
        background:T.ink, color:"#fff", border:"none", fontSize:26, boxShadow:"0 8px 20px rgba(46,58,34,0.35)", display:"flex", alignItems:"center", justifyContent:"center" }}>
        +
      </button>
    </div>
  );
}

function ClientCard({ client, history, onClick }){
  const last = history[0];
  const nb = nextBirthday(client.birthdate);
  const dLeft = nb ? daysUntil(nb) : null;
  const soonBirthday = dLeft !== null && dLeft <= 1;
  const initials = client.name.split(" ").slice(0,2).map(w => w[0]).join("").toUpperCase();
  return (
    <button onClick={onClick} style={{ width:"100%", display:"flex", alignItems:"center", gap:12, padding:"12px 8px", borderRadius:12, border:"none", background:"transparent", textAlign:"left", borderBottom:`1px solid ${T.border}` }}>
      <div style={{ width:38, height:38, borderRadius:"50%", background:T.olive, color:"#fff", fontSize:13, fontWeight:700, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>{initials}</div>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ display:"flex", alignItems:"center", gap:6 }}>
          <span style={{ fontSize:14.5, fontWeight:700, color:T.ink, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{client.name}</span>
          {soonBirthday && <span style={{ fontSize:12 }} title="Cumpleaños">🎂</span>}
        </div>
        <div style={{ fontSize:12, color:T.inkSoft, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
          {last ? `Última visita: ${last.service} · ${formatFullDate(new Date(last.date+"T00:00:00"))}` : "Sin visitas registradas"}
        </div>
      </div>
    </button>
  );
}

function ClientDetail({ client, history, proOf, onUpdate, onSendBirthday, onDelete, onClose }){
  const age = calcAge(client.birthdate);
  const nb = nextBirthday(client.birthdate);
  const dLeft = nb ? daysUntil(nb) : null;
  const showBirthdayCard = dLeft !== null && dLeft <= 1;
  const last = history[0];
  const initials = client.name.split(" ").slice(0,2).map(w => w[0]).join("").toUpperCase();
  const clinical = client.clinical || blankClinical();
  const plans = client.treatmentPlans || [];

  function setClinical(key, value){ onUpdate({ clinical: { ...clinical, [key]: value } }); }
  function updatePlan(id, patch){ onUpdate({ treatmentPlans: plans.map(p => p.id===id ? {...p, ...patch} : p) }); }
  function toggleSession(id, idx){
    const plan = plans.find(p => p.id===id); if(!plan) return;
    const sessions = [...plan.sessions]; sessions[idx] = !sessions[idx];
    updatePlan(id, { sessions });
  }
  function addPlan(){ onUpdate({ treatmentPlans: [...plans, blankTreatmentPlan("")] }); }
  function removePlan(id){ onUpdate({ treatmentPlans: plans.filter(p => p.id!==id) }); }

  return (
    <div>
      <div style={{ background:T.olive, padding:"20px 20px 22px", color:"#fff" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
          <div style={{ display:"flex", alignItems:"center", gap:12 }}>
            <div style={{ width:44, height:44, borderRadius:"50%", background:"rgba(255,255,255,0.25)", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:700 }}>{initials}</div>
            <div>
              <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:23, fontWeight:700 }}>{client.name}</div>
              {age !== null && <div style={{ fontSize:12, opacity:0.85 }}>{age} años</div>}
            </div>
          </div>
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={() => printClient(client, history, proOf)} title="Imprimir ficha"
              style={{ background:"rgba(255,255,255,0.25)", border:"none", borderRadius:8, width:30, height:30, color:"#fff", fontSize:15 }}>🖨</button>
            <button onClick={() => { if(window.confirm(`¿Borrar la ficha de ${client.name}? Esta acción no se puede deshacer.`)) onDelete(); }} title="Borrar cliente"
              style={{ background:"rgba(255,255,255,0.25)", border:"none", borderRadius:8, width:30, height:30, color:"#fff", fontSize:15 }}>🗑️</button>
            <button onClick={onClose} style={{ background:"rgba(255,255,255,0.25)", border:"none", borderRadius:8, width:30, height:30, color:"#fff", fontSize:15 }}>✕</button>
          </div>
        </div>
      </div>

      <div style={{ padding:"18px 20px 28px" }}>
        {showBirthdayCard && (
          <div style={{ background:"#FBF1DE", border:"1px solid #EFDDB0", borderRadius:12, padding:12, marginBottom:16 }}>
            <div style={{ fontSize:12.5, fontWeight:700, color:"#8C6A2A", marginBottom:6 }}>
              🎂 {dLeft === 0 ? "¡Hoy es su cumpleaños!" : "Cumple mañana"}
            </div>
            <div style={{ fontSize:12, color:T.ink, background:"#FFF", border:`1px solid ${T.border}`, borderRadius:8, padding:"8px 10px", marginBottom:10, lineHeight:1.4 }}>
              {buildBirthdayMessage(client)}
            </div>
            {client.phone ? (
              <div style={{ display:"flex", gap:8 }}>
                <a href={`tel:${client.phone.replace(/[^0-9+]/g,"")}`}
                  style={{ flex:1, textAlign:"center", padding:"10px", borderRadius:9, fontWeight:700, fontSize:13, textDecoration:"none", border:`1px solid ${T.border}`, background:T.surface, color:T.ink }}>
                  📞 Llamar
                </a>
                <a href={waLink(client.phone, buildBirthdayMessage(client))} target="_blank" rel="noreferrer" onClick={onSendBirthday}
                  style={{ flex:1, textAlign:"center", padding:"10px", borderRadius:9, fontWeight:700, fontSize:13, textDecoration:"none", background:"#25D366", color:"#fff" }}>
                  Enviar WhatsApp
                </a>
              </div>
            ) : (
              <div style={{ fontSize:12, color:"#C1493B" }}>Agrega su teléfono para poder saludarlo.</div>
            )}
          </div>
        )}

        <SectionLabel>Ficha personal</SectionLabel>
        <Field label="Teléfono (WhatsApp)">
          <input type="tel" value={client.phone||""} onChange={e => onUpdate({ phone:e.target.value })} placeholder="+56 9 1234 5678" style={inputStyle} />
        </Field>
        <Field label="Fecha de nacimiento">
          <input type="date" value={client.birthdate||""} onChange={e => onUpdate({ birthdate:e.target.value })} style={inputStyle} />
        </Field>
        <Field label="Tratamientos">
          <input value={client.tratamientos||""} onChange={e => onUpdate({ tratamientos:e.target.value })} placeholder="Ej: Limpieza facial, Masaje" style={inputStyle} />
        </Field>
        <Field label="Notas">
          <textarea value={client.notes||""} onChange={e => onUpdate({ notes:e.target.value })} placeholder="Preferencias, observaciones..." rows={2} style={{ ...inputStyle, resize:"vertical" }} />
        </Field>

        <SectionLabel>Datos clínicos</SectionLabel>
        <div style={{ marginBottom:16 }}>
          {CLINICAL_FIELDS.map(f => (
            <div key={f.key} style={{ display:"flex", alignItems:"center", gap:10, padding:"6px 0", borderBottom:`1px solid ${T.border}` }}>
              <span style={{ width:110, flexShrink:0, fontSize:12.5, color:T.inkSoft }}>{f.label}</span>
              <input value={clinical[f.key]||""} onChange={e => setClinical(f.key, e.target.value)} placeholder="No"
                style={{ flex:1, border:"none", background:"transparent", fontSize:13.5, padding:"4px 0", outline:"none" }} />
            </div>
          ))}
        </div>

        <SectionLabel>Seguimiento de tratamientos</SectionLabel>
        <div style={{ marginBottom:16 }}>
          {plans.map(p => {
            const validez = fechaValidez(p.fechaInicio);
            return (
              <div key={p.id} style={{ border:`1px solid ${T.border}`, borderRadius:12, padding:12, marginBottom:10 }}>
                <div style={{ display:"flex", gap:8, marginBottom:8 }}>
                  <input value={p.name} onChange={e => updatePlan(p.id, { name:e.target.value })} placeholder="Nombre del tratamiento"
                    style={{ ...inputStyle, flex:1, padding:"8px 10px", fontSize:13.5 }} />
                  <button onClick={() => removePlan(p.id)} title="Quitar" style={{ border:`1px solid ${T.border}`, background:T.surface, borderRadius:9, width:36, color:"#C1493B" }}>✕</button>
                </div>
                <div style={{ display:"flex", gap:8, marginBottom:10 }}>
                  <div style={{ flex:1 }}>
                    <span style={{ fontSize:10.5, color:T.inkSoft, textTransform:"uppercase" }}>Fecha de inicio</span>
                    <input type="date" value={p.fechaInicio} onChange={e => updatePlan(p.id, { fechaInicio:e.target.value })} style={{ ...inputStyle, padding:"7px 9px", fontSize:12.5 }} />
                  </div>
                  <div style={{ flex:1 }}>
                    <span style={{ fontSize:10.5, color:T.inkSoft, textTransform:"uppercase" }}>Fecha de validez</span>
                    <div style={{ ...inputStyle, padding:"7px 9px", fontSize:12.5, background:"#F1EFE7", color:T.inkSoft }}>
                      {validez ? formatFullDate(validez) : "—"}
                    </div>
                  </div>
                </div>
                <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                  {p.sessions.map((done, idx) => (
                    <button key={idx} onClick={() => toggleSession(p.id, idx)}
                      style={{ width:28, height:28, borderRadius:"50%", border:`1px solid ${done ? T.olive : T.border}`,
                        background: done ? T.olive : T.surface, color: done ? "#fff" : T.inkSoft, fontSize:11.5, fontWeight:700 }}>
                      {idx+1}
                    </button>
                  ))}
                </div>
              </div>
            );
          })}
          <button onClick={addPlan} style={{ width:"100%", padding:"10px", borderRadius:10, border:`1px dashed ${T.border}`, background:"transparent", color:T.olive, fontWeight:700, fontSize:13 }}>
            + Agregar tratamiento
          </button>
        </div>

        <SectionLabel>Último agendamiento</SectionLabel>
        {last ? (
          <div style={{ border:`1px solid ${T.border}`, borderRadius:10, padding:"10px 12px", marginBottom:16, fontSize:13 }}>
            <div style={{ fontWeight:700 }}>{last.service}</div>
            <div style={{ color:T.inkSoft, fontSize:12 }}>{formatFullDate(new Date(last.date+"T00:00:00"))} · {timeLabel(mins(last.start))} · {proOf(last.profId)?.name}</div>
          </div>
        ) : (
          <div style={{ color:T.inkSoft, fontSize:12.5, marginBottom:16 }}>Todavía no tiene citas registradas.</div>
        )}

        <SectionLabel>{`Historial (${history.length})`}</SectionLabel>
        <div>
          {history.map(h => (
            <Row key={h.id} text={`${h.service} · ${formatFullDate(new Date(h.date+"T00:00:00"))}`} dot={proOf(h.profId)?.color} />
          ))}
          {history.length === 0 && <div style={{ color:T.inkSoft, fontSize:12.5 }}>Sin historial todavía.</div>}
        </div>
      </div>
    </div>
  );
}
function SectionLabel({ children }){
  return <div style={{ marginTop:18, marginBottom:8, fontSize:11, fontWeight:700, color:T.inkSoft, textTransform:"uppercase", letterSpacing:"0.05em" }}>{children}</div>;
}

function BackupView({ clients, appointments, onRestore, pros, onAddPro, onRemovePro, services, onAddService, onRemoveService, onClose }){
  const fileRef = useRef(null);
  const [msg, setMsg] = useState(null);
  const [newName, setNewName] = useState("");
  const [newRole, setNewRole] = useState("");
  const [newService, setNewService] = useState("");

  function download(){
    const payload = { exportedAt: new Date().toISOString(), spa: SPA_NAME, clients, appointments, pros, services };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = iso(new Date());
    a.href = url;
    a.download = `backup-sonia-lanoza-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function handleFile(e){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.clients) || !Array.isArray(data.appointments)) throw new Error("Formato inválido");
        onRestore(data);
        setMsg({ ok:true, text:`Restaurado: ${data.clients.length} clientes, ${data.appointments.length} citas${data.pros ? `, ${data.pros.length} profesionales` : ""}.` });
      } catch(err){
        setMsg({ ok:false, text:"No se pudo leer el archivo. Asegúrate de elegir un backup exportado desde esta app." });
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  function submitNewPro(){
    if(!newName.trim()) return;
    onAddPro(newName, newRole);
    setNewName(""); setNewRole("");
  }
  function submitNewService(){
    if(!newService.trim()) return;
    onAddService(newService);
    setNewService("");
  }

  return (
    <div style={{ padding:"18px 20px 28px" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:22, fontWeight:700 }}>Configuración</div>
        <button onClick={onClose} style={{ ...navBtn, border:"none" }}>✕</button>
      </div>

      <SectionLabel>Profesionales</SectionLabel>
      <div style={{ marginBottom:14 }}>
        {pros.map(p => (
          <div key={p.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 0", borderBottom:`1px solid ${T.border}` }}>
            <div style={{ width:32, height:32, borderRadius:"50%", background:p.color, color:"#fff", fontSize:12, fontWeight:700, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>{p.initials}</div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:13.5, fontWeight:700, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{p.name}</div>
              <div style={{ fontSize:11.5, color:T.inkSoft }}>{p.role}</div>
            </div>
            <button onClick={() => onRemovePro(p.id)} title="Eliminar" style={{ border:`1px solid ${T.border}`, background:T.surface, borderRadius:8, width:32, height:32, color:"#C1493B" }}>✕</button>
          </div>
        ))}
      </div>
      <div style={{ display:"flex", gap:8, marginBottom:8 }}>
        <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="Nombre" style={{ ...inputStyle, flex:1, padding:"9px 11px", fontSize:13 }} />
        <input value={newRole} onChange={e => setNewRole(e.target.value)} placeholder="Rol (opcional)" style={{ ...inputStyle, flex:1, padding:"9px 11px", fontSize:13 }} />
      </div>
      <button onClick={submitNewPro} disabled={!newName.trim()} style={{ width:"100%", padding:"10px", borderRadius:10, border:`1px dashed ${T.border}`,
        background:"transparent", color: newName.trim() ? T.olive : T.inkSoft, fontWeight:700, fontSize:13, marginBottom:6 }}>
        + Agregar profesional
      </button>
      <div style={{ fontSize:11.5, color:T.inkSoft, marginBottom:8 }}>
        El nombre de cada profesional aparece automáticamente en los mensajes de WhatsApp de sus propias citas. Ahora mismo hay una sola: Sonia Lanoza.
      </div>

      <SectionLabel>Tratamientos</SectionLabel>
      <div style={{ marginBottom:14 }}>
        {services.map(s => (
          <div key={s.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 0", borderBottom:`1px solid ${T.border}` }}>
            <div style={{ flex:1, fontSize:13.5, fontWeight:600 }}>{s.name}</div>
            <button onClick={() => onRemoveService(s.id)} title="Eliminar" style={{ border:`1px solid ${T.border}`, background:T.surface, borderRadius:8, width:32, height:32, color:"#C1493B" }}>✕</button>
          </div>
        ))}
        {services.length === 0 && <div style={{ color:T.inkSoft, fontSize:12.5, padding:"6px 0" }}>Sincronizando tratamientos…</div>}
      </div>
      <div style={{ display:"flex", gap:8, marginBottom:8 }}>
        <input value={newService} onChange={e => setNewService(e.target.value)} placeholder="Nombre del tratamiento" style={{ ...inputStyle, flex:1, padding:"9px 11px", fontSize:13 }}
          onKeyDown={e => { if(e.key === "Enter") submitNewService(); }} />
      </div>
      <button onClick={submitNewService} disabled={!newService.trim()} style={{ width:"100%", padding:"10px", borderRadius:10, border:`1px dashed ${T.border}`,
        background:"transparent", color: newService.trim() ? T.olive : T.inkSoft, fontWeight:700, fontSize:13, marginBottom:6 }}>
        + Agregar tratamiento
      </button>
      <div style={{ fontSize:11.5, color:T.inkSoft, marginBottom:8 }}>
        Estos son los tratamientos que aparecen para elegir al agendar una cita nueva.
      </div>

      <SectionLabel>Copia de seguridad</SectionLabel>
      <div style={{ fontSize:13, color:T.inkSoft, marginBottom:18, lineHeight:1.5 }}>
        Los datos ya se guardan solos en la nube y se sincronizan automáticamente entre el celular y la computadora — no hace falta hacer nada para que se guarden.
        Igual, te recomendamos descargar un backup de vez en cuando por las dudas. Restaurar un backup reemplaza todos los datos actuales por los del archivo.
      </div>

      <div style={{ border:`1px solid ${T.border}`, borderRadius:12, padding:14, marginBottom:14 }}>
        <div style={{ fontSize:12.5, fontWeight:700, marginBottom:4 }}>Datos actuales en esta sesión</div>
        <div style={{ fontSize:12.5, color:T.inkSoft }}>{clients.length} clientes · {appointments.length} citas · {pros.length} profesionales · {services.length} tratamientos</div>
      </div>

      <button onClick={download} style={{ width:"100%", background:T.ink, color:"#fff", border:"none", borderRadius:11, padding:"13px", fontWeight:700, fontSize:14, marginBottom:10 }}>
        ⬇️ Descargar backup (.json)
      </button>

      <button onClick={() => fileRef.current && fileRef.current.click()} style={{ width:"100%", background:T.surface, color:T.ink, border:`1px solid ${T.border}`, borderRadius:11, padding:"13px", fontWeight:700, fontSize:14 }}>
        ⬆️ Restaurar desde un backup
      </button>
      <input ref={fileRef} type="file" accept="application/json" onChange={handleFile} style={{ display:"none" }} />

      {msg && (
        <div style={{ marginTop:14, fontSize:12.5, padding:"10px 12px", borderRadius:9, background: msg.ok ? "#EAF0E3" : "#FDF3F1", color: msg.ok ? "#3E4E2C" : "#C1493B" }}>
          {msg.text}
        </div>
      )}
    </div>
  );
}

function NewClientForm({ sheet, setSheet, onSave, onClose }){
  const set = (k,v) => setSheet(m => ({ ...m, [k]: v }));
  return (
    <div style={{ padding:"18px 20px 28px" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:22, fontWeight:700 }}>Nuevo cliente</div>
        <button onClick={onClose} style={{ ...navBtn, border:"none" }}>✕</button>
      </div>
      <Field label="Nombre">
        <input autoFocus value={sheet.name} onChange={e => set("name", e.target.value)} placeholder="Nombre del cliente" style={inputStyle} />
      </Field>
      <Field label="Teléfono (WhatsApp)">
        <input type="tel" value={sheet.phone} onChange={e => set("phone", e.target.value)} placeholder="+56 9 1234 5678" style={inputStyle} />
      </Field>
      <Field label="Fecha de nacimiento">
        <input type="date" value={sheet.birthdate} onChange={e => set("birthdate", e.target.value)} style={inputStyle} />
      </Field>
      <Field label="Tratamientos">
        <input value={sheet.tratamientos} onChange={e => set("tratamientos", e.target.value)} placeholder="Ej: Limpieza facial, Masaje" style={inputStyle} />
      </Field>
      <Field label="Notas">
        <textarea value={sheet.notes} onChange={e => set("notes", e.target.value)} rows={3} style={{ ...inputStyle, resize:"vertical" }} />
      </Field>
      <div style={{ fontSize:12, color:T.inkSoft, marginBottom:16 }}>Los datos clínicos y el seguimiento de sesiones se completan después, abriendo la ficha del cliente.</div>
      <button onClick={onSave} disabled={!sheet.name.trim()} style={{ width:"100%", marginTop:6, background: sheet.name.trim() ? T.ink : "#C9C2AF",
        color:"#fff", border:"none", borderRadius:11, padding:"14px", fontWeight:700, fontSize:15 }}>
        Guardar cliente
      </button>
    </div>
  );
}

function BottomSheet({ children, onClose }){
  return (
    <div className="sheet-overlay" onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(46,58,34,0.4)", display:"flex", alignItems:"flex-end", zIndex:50 }}>
      <div className="sheet-panel" onClick={e => e.stopPropagation()} style={{ background:T.surface, borderRadius:"20px 20px 0 0", width:"100%", maxWidth:480, margin:"0 auto",
        maxHeight:"88vh", overflowY:"auto", boxShadow:"0 -10px 40px rgba(46,58,34,0.25)" }}>
        <div style={{ width:40, height:4, borderRadius:2, background:T.border, margin:"10px auto 0" }} />
        {children}
      </div>
    </div>
  );
}

function Field({ label, children }){
  return (
    <div style={{ marginBottom:14 }}>
      <label style={{ display:"block", fontSize:11, fontWeight:700, color:T.inkSoft, textTransform:"uppercase", letterSpacing:"0.05em", marginBottom:6 }}>{label}</label>
      {children}
    </div>
  );
}
const inputStyle = { width:"100%", padding:"11px 12px", borderRadius:10, border:`1px solid ${T.border}`, fontSize:15, background:"#FCFBF8" };

function NewForm({ sheet, setSheet, onSave, onClose, clients, pros, services }){
  const set = (k,v) => setSheet(m => ({ ...m, [k]: v }));
  function onClientChange(name){
    set("client", name);
    const match = clients.find(c => c.name.toLowerCase() === name.trim().toLowerCase());
    if (match && !sheet.phone) set("phone", match.phone || "");
  }
  return (
    <div style={{ padding:"18px 20px 28px" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:22, fontWeight:700 }}>Nueva cita</div>
        <button onClick={onClose} style={{ ...navBtn, border:"none" }}>✕</button>
      </div>
      <Field label="Cliente">
        <input autoFocus list="clientes-list" value={sheet.client} onChange={e => onClientChange(e.target.value)} placeholder="Nombre del cliente" style={inputStyle} />
        <datalist id="clientes-list">
          {clients.map(c => <option key={c.id} value={c.name} />)}
        </datalist>
      </Field>
      <Field label="Teléfono (WhatsApp)">
        <input type="tel" value={sheet.phone} onChange={e => set("phone", e.target.value)} placeholder="+56 9 1234 5678" style={inputStyle} />
      </Field>
      <Field label="Servicio">
        <select value={sheet.service} onChange={e => set("service", e.target.value)} style={inputStyle}>
          {services.map(s => <option key={s.id}>{s.name}</option>)}
        </select>
      </Field>
      <Field label="Profesional">
        <select value={sheet.profId} onChange={e => set("profId", e.target.value)} style={inputStyle}>
          {pros.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </Field>
      <div style={{ display:"flex", gap:10 }}>
        <div style={{ flex:1 }}><Field label="Fecha"><input type="date" value={sheet.date} onChange={e => set("date", e.target.value)} style={inputStyle} /></Field></div>
        <div style={{ flex:1 }}><Field label="Hora"><input type="time" value={sheet.start} onChange={e => set("start", e.target.value)} style={inputStyle} /></Field></div>
      </div>
      <Field label="Duración">
        <select value={sheet.duration} onChange={e => set("duration", e.target.value)} style={inputStyle}>
          {[15,30,45,60,90,120].map(m => <option key={m} value={m}>{m} min</option>)}
        </select>
      </Field>
      <div style={{ display:"flex", gap:8, alignItems:"flex-start", background:"#F0ECDC", borderRadius:10, padding:"10px 12px", marginBottom:16, fontSize:12.5, color:T.olive }}>
        <span>🌿</span>
        <span>El día antes de la cita vas a poder enviarle a {sheet.client.trim() ? sheet.client.trim().split(" ")[0] : "tu cliente"} un recordatorio por WhatsApp para que confirme su asistencia.</span>
      </div>
      <button onClick={onSave} disabled={!sheet.client.trim()} style={{ width:"100%", marginTop:6, background: sheet.client.trim() ? T.ink : "#C9C2AF",
        color:"#fff", border:"none", borderRadius:11, padding:"14px", fontWeight:700, fontSize:15 }}>
        Agendar cita
      </button>
    </div>
  );
}

function Detail({ appt, pro, onDelete, onToggle, onSendReminder, onConfirmReminder, onClose }){
  const rd = reminderDate(appt);
  const message = buildReminderMessage(appt, pro);
  const hasPhone = !!(appt.phone && appt.phone.trim());
  const badge = appt.reminderStatus === "confirmada"
    ? { text:"Cliente confirmó", bg:"#EAF0E3", fg:"#3E4E2C" }
    : appt.reminderStatus === "enviado"
    ? { text:"Recordatorio enviado", bg:"#FBF1DE", fg:"#8C6A2A" }
    : { text:"Recordatorio pendiente", bg:"#F1EFE7", fg:T.inkSoft };

  return (
    <div>
      <div style={{ background:pro.color, borderRadius:"0", padding:"20px 20px 22px", color:"#fff" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
          <div>
            <div style={{ fontSize:11, opacity:0.85, textTransform:"uppercase", fontWeight:700, letterSpacing:"0.06em" }}>{appt.status}</div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:24, fontWeight:700, marginTop:2 }}>{appt.client}</div>
          </div>
          <button onClick={onClose} style={{ background:"rgba(255,255,255,0.25)", border:"none", borderRadius:8, width:30, height:30, color:"#fff", fontSize:15 }}>✕</button>
        </div>
      </div>
      <div style={{ padding:"18px 20px 28px" }}>
        <Row text={appt.service} />
        <Row text={`${timeLabel(mins(appt.start))} · ${appt.duration} min`} />
        <Row text={`${pro.name} · ${pro.role}`} dot={pro.color} />
        {hasPhone && <Row text={appt.phone} />}

        <div style={{ marginTop:18, border:`1px solid ${T.border}`, borderRadius:14, padding:14 }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
            <span style={{ fontSize:12.5, fontWeight:700, color:T.ink }}>Recordatorio de confirmación</span>
            <span style={{ fontSize:10.5, fontWeight:700, padding:"3px 9px", borderRadius:999, background:badge.bg, color:badge.fg }}>{badge.text}</span>
          </div>
          <div style={{ fontSize:12.5, color:T.inkSoft, marginBottom:10 }}>
            Se sugiere enviarlo el {formatFullDate(rd)} (un día antes de la cita).
          </div>
          <div style={{ fontSize:12.5, color:T.ink, background:"#FAF8F1", border:`1px solid ${T.border}`, borderRadius:10, padding:"9px 11px", marginBottom:12, lineHeight:1.4 }}>
            {message}
          </div>

          {!hasPhone && (
            <div style={{ fontSize:12, color:"#C1493B", marginBottom:8 }}>Agrega el teléfono del cliente para poder enviarle el recordatorio.</div>
          )}

          {appt.reminderStatus !== "confirmada" && (
            <div style={{ display:"flex", gap:8 }}>
              <a href={hasPhone ? waLink(appt.phone, message) : undefined} target="_blank" rel="noreferrer"
                onClick={(e) => { if(!hasPhone){ e.preventDefault(); return; } onSendReminder(); }}
                style={{ flex:1, textAlign:"center", padding:"11px", borderRadius:10, fontWeight:700, fontSize:13, textDecoration:"none",
                  background: hasPhone ? "#25D366" : "#D8D2C0", color:"#fff", opacity: hasPhone ? 1 : 0.7, pointerEvents: hasPhone ? "auto" : "none" }}>
                Enviar por WhatsApp
              </a>
              {appt.reminderStatus === "enviado" && (
                <button onClick={onConfirmReminder} style={{ flex:1, padding:"11px", borderRadius:10, border:`1px solid ${T.border}`, background:T.surface, fontWeight:700, fontSize:13 }}>
                  Simular respuesta "Sí"
                </button>
              )}
            </div>
          )}
        </div>

        <div style={{ display:"flex", gap:10, marginTop:14 }}>
          <button onClick={onToggle} style={{ flex:1, padding:"12px", borderRadius:11, border:`1px solid ${T.border}`, background:T.surface, fontWeight:600, fontSize:14 }}>
            {appt.status==="confirmada" ? "Marcar pendiente" : "Confirmar"}
          </button>
          <button onClick={onDelete} style={{ padding:"12px 16px", borderRadius:11, border:"1px solid #F3D8D3", background:"#FDF3F1", color:"#C1493B", fontWeight:600, fontSize:14 }}>
            Cancelar
          </button>
        </div>
      </div>
    </div>
  );
}
function Row({ text, dot }){
  return (
    <div style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 0", borderBottom:`1px solid ${T.border}`, fontSize:14.5 }}>
      {dot ? <span style={{ width:12, height:12, borderRadius:"50%", background:dot }} /> : <span style={{ width:12 }} />}
      {text}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
